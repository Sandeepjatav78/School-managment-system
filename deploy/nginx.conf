# /etc/nginx/sites-available/athena
# Symlink: sudo ln -s /etc/nginx/sites-available/athena /etc/nginx/sites-enabled/
# Replace school.example.com with your domain.

server {
    listen 80;
    server_name school.example.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name school.example.com;

    ssl_certificate     /etc/letsencrypt/live/school.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads (not used yet, but ready)
    client_max_body_size 5m;

    # Security headers (helmet also sets these at the app level)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
